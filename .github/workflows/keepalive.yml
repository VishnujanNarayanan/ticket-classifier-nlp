name: Keep the demo awake

# Streamlit Community Cloud puts an app to sleep after about a week without
# traffic, and a sleeping app shows a "get this app back up" splash instead of
# the demo — which is the worst thing a recruiter following the link can hit.
# A twice-daily request is enough to keep it warm.
#
# NOTE: GitHub disables scheduled workflows on a repository with no activity for
# 60 days. If the demo starts sleeping again, check that this workflow is still
# enabled under the Actions tab.

on:
  schedule:
    - cron: "0 6,18 * * *"   # 06:00 and 18:00 UTC
  workflow_dispatch:          # and on demand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        env:
          APP_URL: https://ticket-classifier-demonstration.streamlit.app
        run: |
          set -u
          JAR=$(mktemp)
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'

          # Streamlit Cloud runs an anonymous session handshake before serving a
          # PUBLIC app: the root 303s to share.streamlit.io/-/auth/app, which sets a
          # cookie and redirects back. A bare `curl` sees only that first 303 and
          # looks exactly like a private app -- which is how an earlier version of
          # this workflow reported a public app as private. Carry cookies through
          # the redirect chain and read the FINAL status instead.
          health=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$APP_URL/healthz" || echo 000)
          root=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 60 \
                   -c "$JAR" -b "$JAR" -A "$UA" "$APP_URL/" || echo 000)
          rm -f "$JAR"
          echo "healthz: $health"
          echo "root:    $root (after redirects, with cookies)"

          if [ "$health" != "200" ]; then
            echo "::error::App is not responding (healthz=$health). It may be asleep or the deploy is broken."
            exit 1
          fi
          if [ "$root" != "200" ]; then
            echo "::error::App did not serve after the session handshake (root=$root). Check the deploy and the sharing setting."
            exit 1
          fi
          echo "Demo is awake and publicly reachable."
